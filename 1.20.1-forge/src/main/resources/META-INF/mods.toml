modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[modproperties.${mod_id}]
catalogueImageIcon = "logo.png"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="logo.png"
description='''
允许在容器界面中滚动物品提示。

本版本（Reforged）在原版 Great Scrollable Tooltips 的基础上修改，新增功能：
- 支持在 JEI / EMI 的容器界面与配方界面中使用方向键滚动物品提示
- 新增配置项：按键反转（上下左右方向键）
- 新增配置项：关闭鼠标滚轮位移（默认开启，避免与物品列表滚动冲突）
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
